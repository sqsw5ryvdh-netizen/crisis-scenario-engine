# Trigger scenarios. Each preset is a set of parameter values plus dated news events.
# severity multiplies every deposit category's base run-off rate (1.0 = baseline).
# panic_shock is added to x in the panic multiplier from the event day onwards.
# The cyber/ICT outage and geopolitical presets are not built yet (see docs/STATUS.md).

fast_run:
  name: Fast digital run
  description: Social-media driven run that unfolds over hours to days.
  severity:
    value: 3.0
    unit: multiplier
    source: ASSUMPTION
  news_events:
    - day: 1
      headline: Rumours about the bank's solvency spread on social media.
      panic_shock: 0.10
    - day: 2
      headline: Screenshots of failed transfers go viral; the bank denies liquidity problems.
      panic_shock: 0.05

slow_burn:
  name: Slow burn
  description: Weeks of gradual confidence erosion.
  severity:
    value: 1.0
    unit: multiplier
    source: ASSUMPTION
  news_events:
    - day: 5
      headline: The bank reports a larger than expected quarterly loss.
      panic_shock: 0.02
    - day: 12
      headline: A rating agency places the bank on negative watch.
      panic_shock: 0.03
    - day: 20
      headline: Press reports that large corporate clients are moving their accounts.
      panic_shock: 0.03
