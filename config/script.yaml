# Exercise script (SPEC_V2 phase D): texts, clock times and coordination steps.
#
# No text here may carry a figure. Every number in a player's document is added by the
# engine from that player's information set (config/decisions.yaml, `information`).
# The placeholders each text may use are fixed in engine/schema.py (SCRIPT_TEXTS).
#
# DRAFT: all wording, the coordination steps and the debrief questions were drafted for this
# prototype and have not been reviewed by a practitioner. They contain no legal references.

# The run the app opens on, the guided demo follows and `--showcase` exports: about ten days,
# across one weekend, to a FoLtF declaration on a Friday evening and a resolution weekend.
showcase:
  bank: retail
  scenario: geopolitical
  path: weekend_bail_in
  compare_path: weekend_liquidation

draft_notice: >-
  Draft wording. The texts, the coordination steps and the debrief questions in this document
  were written for a prototype and have not been reviewed by a practitioner. They contain no
  legal references.

disclaimer: >-
  The bank in this script is fictitious. All figures are produced by a simplified simulation
  model whose parameters are assumptions, not calibrated estimates. The script is a training
  aid for crisis simulation exercises and does not describe any real institution.

actors:
  competent_authority: Competent authority
  resolution_authority: Resolution authority
  central_bank: Central bank
  deposit_guarantee_scheme: Deposit guarantee scheme
  bank_management: Bank management

# Time of day shown on each kind of inject. Labels only: the model works in whole days.
# A stage change reaches the bank first (stage), then the competent authority, told by the
# bank (stage_relay), then the other authorities, told by the competent authority
# (stage_relay_others).
clock:
  opening: "08:00"
  news: "09:00"
  stage: "18:00"
  stage_relay: "18:30"
  stage_relay_others: "19:00"
  decision_due: "19:30"
  decision_taken: "08:00"
  end: "18:00"

# How long a decision stays open when the path without decisions has no payments default.
decision_window_days:
  value: 2
  unit: days
  source: ASSUMPTION

texts:
  opening: >-
    The exercise starts. {bank_name} is operating normally.
  news: "Public news: {headline}"
  recovery: >-
    Notification from {sender}: {bank_name} has breached a recovery indicator.
  early_intervention: >-
    Notification from {sender}: the conditions for early intervention at {bank_name} are met.
  likely_to_fail: >-
    Notification from {sender}: on current trends {bank_name} is likely to fail. Its
    liquidity or its capital is about to run out. It is still paying its obligations.
  failure: >-
    Notification from {sender}: {bank_name} could not pay its obligations in full today.
  foltf: >-
    {bank_name} has been declared failing or likely to fail by the competent authority.
  resolution: >-
    The exercise ends today for {bank_name}. Outcome: {outcome}.
  decision_taken: >-
    {decider} has decided on "{decision_name}": {option_name}. In effect from day
    {effect_day}.
  decision_due: >-
    A decision is now open to you: {decision_name}.
  end_open: >-
    The exercise ends after {horizon_days} days. {bank_name} is still open.
  course_correction: >-
    Control team: the exercise is linear. Whatever you decided on "{decision_name}", continue
    on this basis: {option_name}. Your own decision is recorded for the debrief.

# What the control team looks for after each kind of inject (main events list). No figures.
# stage: the competent authority is told by the bank and should pass it on ({inform}).
expected:
  opening: Read the briefing. No action is expected yet.
  news: Take note. Consider whether it changes your assessment or calls for a public line.
  stage: >-
    Assess the figures and what they mean for the decisions open to you. Pass the
    notification on to: {inform}.
  stage_relayed: >-
    Assess what it means for your own tasks. Ask the sender for the information you are
    missing.
  foltf: Start the steps that follow the declaration. Confirm who leads and who communicates.
  resolution: None. The debrief follows.
  decision_taken: Take note. Reassess the decisions open to you.
  decision_due: >-
    Decide by the deadline and tell the control team. Consult first: {consult}. Inform
    afterwards: {inform}.
  end_open: None. The debrief follows.
  course_correction: >-
    Continue on the stated basis. The control team notes the deviation and raises it in the
    debrief.

# Ambient injects: background noise with no effect on any figure. The control team can switch
# them off. Each is placed `offset_days` after its anchor (a stage, or "foltf") if the run
# gets there, and only for recipients that are informed by then. Texts carry no figures.
ambient:
  press_enquiry:
    title: Press enquiry
    sender: A national newspaper
    recipients: [bank_management, competent_authority]
    anchor: recovery
    offset_days: 1
    time: "11:00"
    text: >-
      A journalist asks whether {bank_name} is in difficulty and whether the authorities
      are involved. A reply is requested before the evening edition.
    role: media
    expected: >-
      Agree who answers and with which line. Tell the other authorities what was said.
  tv_footage:
    title: TV footage of branch queues
    sender: A television news channel
    recipients: [bank_management, competent_authority, central_bank]
    anchor: early_intervention
    offset_days: 1
    time: "13:00"
    text: >-
      A news channel shows customers queuing outside two branches of {bank_name} and
      asks for a comment on air.
    role: media
    expected: >-
      Agree one line with the other authorities before anyone answers. Do not confirm figures on air.
  ministry_call:
    title: Call from the finance ministry
    sender: The finance ministry
    recipients: [competent_authority, resolution_authority]
    anchor: early_intervention
    offset_days: 1
    time: "15:00"
    text: >-
      A senior official at the finance ministry asks for an update on {bank_name} and
      whether public funds could be needed. The minister expects a briefing today.
    role: finance_minister
    expected: >-
      Brief the ministry on agreed facts only. Agree between authorities who speaks to the ministry.
  foreign_authority_request:
    title: Request from a foreign authority
    sender: A supervisory authority abroad
    recipients: [competent_authority, resolution_authority]
    anchor: likely_to_fail
    offset_days: 1
    time: "10:00"
    text: >-
      The authority supervising a foreign branch of {bank_name} asks what you intend to
      do and when it will be told. It is considering measures of its own.
    role: control_team
    expected: >-
      Reply with what can be shared and say when more will follow. Tell the other authorities about the request.
  parliamentary_question:
    title: Parliamentary question
    sender: A member of parliament
    recipients: [competent_authority]
    anchor: likely_to_fail
    offset_days: 2
    time: "12:00"
    text: >-
      A member of parliament tables an urgent question on the supervision of
      {bank_name} and asks why depositors have not been told more.
    role: control_team
    expected: >-
      Prepare a holding reply. Check it against what has been said in public so far.
  depositor_association:
    title: Letter from a depositors' association
    sender: A depositors' association
    recipients: [deposit_guarantee_scheme, resolution_authority]
    anchor: foltf
    offset_days: 0
    time: "14:00"
    text: >-
      An association of depositors asks when and how customers of {bank_name} will have
      access to their money, and where they should turn for information.
    role: control_team
    expected: >-
      Agree one message for depositors and who gives it. Do not promise dates that are not agreed.

# Injects of the resolution period: after FoLtF is in effect and before the tool applies.
# Each is placed `offset_days` after the FoLtF day (never after the last day of the run).
# figures: groups of resolution figures it carries (capital, mrel, losses, liquidity). They are
# estimates that rest on an assumed write-down; the control team picks low, central or high.
resolution:
  valuation:
    title: Provisional valuation
    sender: The independent valuer
    recipients: [resolution_authority, competent_authority]
    offset_days: 0
    time: "12:00"
    text: >-
      The provisional valuation of {bank_name} is in. It is an estimate made under time
      pressure and may be revised. It gives the write-down of the loan book and the capital
      needed to restore the requirement.
    role: independent_valuer
    expected: >-
      Share the valuation with the other authorities. Assess whether available loss-absorbing capacity covers the need.
    figures: [capital, mrel]
  loss_allocation:
    title: Who bears the losses
    sender: The resolution team
    recipients: [resolution_authority, competent_authority, central_bank, deposit_guarantee_scheme, bank_management]
    offset_days: 1
    time: "10:00"
    text: >-
      The resolution team has worked out who would bear the losses of {bank_name} under
      the option being prepared: {tool}. The order of loss absorption is the one used in
      this model.
    role: control_team
    expected: >-
      Check the allocation against the chosen tool. Identify who must be told before the announcement.
    figures: [losses]
  communication:
    title: Communication before the bank reopens
    sender: Exercise control
    recipients: [resolution_authority, competent_authority, central_bank, deposit_guarantee_scheme, bank_management]
    offset_days: 1
    time: "15:00"
    text: >-
      Markets open tomorrow morning. Agree who announces the outcome for {bank_name}, at
      what time, and with which message for depositors, for creditors and for staff. Agree
      who answers the press, and what each authority will not say.
    role: control_team
    expected: >-
      Agree one announcement, its time and its speakers, and write it down.
  reopening_liquidity:
    title: Liquidity when the bank reopens
    sender: The resolution team
    recipients: [resolution_authority, central_bank, bank_management]
    offset_days: 1
    time: "17:00"
    text: >-
      Estimate of the liquidity {bank_name} needs over the days after it reopens,
      including the withdrawals requested during the weekend and not yet settled. Decide
      who provides it and against what.
    role: control_team
    expected: >-
      Agree the source of the liquidity, the collateral and who decides, before the bank reopens.
    figures: [liquidity]

# Challenge injects (EBA Handbook, par. 123, 129 and 192). Each can be switched on or off by
# the control team. default: part of the pack unless switched off. hostile: added when the
# assumptions are set to hostile. Placed `offset_days` after the anchor, like ambient injects.
# Only the rating downgrade changes the run (a news event with a panic shock, set in
# config/model.yaml); the others change no figure of the simulation.
challenges:
  buyer_interest:
    title: A potential buyer shows interest
    sender: A potential buyer
    role: potential_buyers
    recipients: [resolution_authority]
    anchor: foltf
    offset_days: 0
    time: "16:00"
    default: true
    effect: indicative_bid
    text: >-
      A bank has told the resolution authority that it is interested in buying
      {bank_name}. It gives an indicative, non-binding price and asks for access to data. It
      will not confirm before it has seen the valuation.
    expected: >-
      Reassess whether a sale of business is possible in the time left. Decide what the buyer
      may see. Tell the other authorities.
  second_valuation:
    title: Updated valuation, worse than the first
    sender: The independent valuer
    role: independent_valuer
    recipients: [resolution_authority]
    anchor: foltf
    offset_days: 1
    time: "13:00"
    default: true
    effect: second_valuation
    figures: [capital, mrel, losses]
    text: >-
      Unsolicited update from the valuer: a closer look at the loan book of {bank_name}
      shows larger losses than the provisional valuation. The figures below replace the
      earlier ones.
    expected: >-
      Share the update with the other authorities at once. Reconsider who bears the losses and
      whether the chosen tool still holds.
  buyers_withdraw:
    title: All potential buyers withdraw
    sender: The potential buyers
    role: potential_buyers
    recipients: [resolution_authority]
    anchor: foltf
    offset_days: 1
    time: "11:00"
    hostile: true
    text: >-
      Every party that had shown interest in {bank_name} has withdrawn before making a
      binding offer. A sale of business is no longer available.
    expected: >-
      Drop the sale of business and move to another tool without losing the timetable. Tell
      the other authorities.
  creditor_challenge:
    title: Creditors announce a legal challenge
    sender: A group of bondholders
    role: control_team
    recipients: [resolution_authority]
    anchor: foltf
    offset_days: 1
    time: "14:00"
    hostile: true
    text: >-
      A group of bondholders of {bank_name} announces that it will contest any write-down
      of its claims and asks for the valuation to be disclosed.
    expected: >-
      Check that the decision and the valuation are documented. Agree what can be disclosed
      and who answers. Do not let it delay the decision.
  rating_downgrade:
    title: Rating downgrade
    sender: Public media
    role: media
    recipients: [competent_authority, resolution_authority, central_bank, deposit_guarantee_scheme]
    anchor: early_intervention
    offset_days: 1
    time: "09:00"
    effect: panic_shock
    text: >-
      A rating agency downgrades {bank_name} and keeps it under review for a further cut
    expected: >-
      Expect faster outflows. Reassess the liquidity position and the decisions open to you.

# Simulated stakeholders: the roles the control team plays (EBA Handbook, par. 132 and 198).
# Each has a role card. The texts carry no figures; the engine adds the figures a role holds.
# lines: what the role says at each moment (normal, recovery, early_intervention,
# likely_to_fail, foltf, resolution).
roles:
  bank_management:
    name: Bank management
    knows:
      - You have the bank's own figures of the same day, and the day's outflows by time of day.
      - You know what you have reported to the competent authority, and nothing about what the authorities discuss among themselves.
    wants:
      - To keep {bank_name} open and independent, and to keep your posts.
      - To avoid any public sign of weakness, and to obtain central bank funding early.
    lines:
      normal: Business as usual. You report on the usual schedule and volunteer nothing.
      recovery: You notify the competent authority, as you must. You present the breach as temporary and point to the recovery plan.
      early_intervention: You argue that the recovery options are working and that more intrusive measures would be noticed by the market.
      likely_to_fail: You ask for emergency liquidity and for time. You resist any talk of failure, but you answer questions on figures truthfully.
      foltf: You cooperate. You ask what happens to payments, to staff and to you, and when customers will be told.
      resolution: You carry out instructions and ask for one clear message to give to staff and customers.
  independent_valuer:
    name: Independent valuer
    knows:
      - You have the bank's balance sheet at the declaration and limited access to the loan files.
      - You work under time pressure. Your first report is provisional and you say so.
    wants:
      - To protect your independence. You do not adjust a figure because an authority finds it inconvenient.
      - More time and more data than you are given.
    lines:
      foltf: You deliver the provisional valuation when the resolution authority asks for it, or at the planned time. You stress that it may be revised.
      resolution: If asked, you explain the method in plain words and say what you could not check. If the updated valuation is in play, you deliver it unprompted and explain what changed.
  media:
    name: Media
    knows:
      - Only what is public, what customers say, and what you can see outside the branches.
      - You hold no figure of the bank. If you quote one, it comes from a player who gave it to you.
    wants:
      - A statement on the record, today, from the bank and from an authority.
      - Any sign that the authorities disagree or are holding something back.
    lines:
      normal: You report the news of the scenario. You ask nothing yet.
      recovery: You ask the bank and the competent authority whether the bank is in difficulty, with a deadline for the reply.
      early_intervention: You report queues and ask for a comment on air. You compare the answers of different authorities.
      likely_to_fail: You ask whether deposits are safe and whether the authorities are preparing to step in.
      foltf: You ask who decides what happens next, when the bank reopens and who will lose money.
      resolution: You ask for the announcement, and who pays.
  finance_minister:
    name: Finance minister
    knows:
      - What is public, and what the authorities choose to tell your officials.
      - You have no figures of your own. You ask for them and you remember what you were told.
    wants:
      - No use of public funds, and no surprise in the press or in parliament.
      - To be briefed before any announcement, and to know who is in charge.
    lines:
      early_intervention: Your officials call for an update and ask whether public funds could be needed.
      likely_to_fail: You ask what the options are, what each costs and who decides. You press for a date.
      foltf: You ask to see the announcement before it goes out and you question any option that touches depositors.
      resolution: You ask what you can say in public and what happens on the day the bank reopens.
  potential_buyers:
    name: Potential buyers
    knows:
      - What is public, and what the resolution authority gives you access to.
      - Your interest and your price are indicative until you have seen the valuation.
    wants:
      - The deposits and the good loans, at a low price, with the losses covered by someone else.
      - Time for due diligence, which you will not get.
    lines:
      foltf: One of you tells the resolution authority that it is interested and names an indicative price. You ask for data access and for the timetable.
      resolution: You confirm or withdraw as the main events list says. If you withdraw, you give no reason beyond the uncertainty on the losses.

# Set-up documents (SPEC_V3 G7, G8, G10). Drafts for the design team to edit: every text
# here is pre-filled wording of this project, except where it says it quotes the Handbook
# (EBA/REP/2025/20). The texts carry no figures; the engine adds them.
setup:
  # Neutral names used in every document of the pack, so that nothing points to a real
  # institution or country (EBA Handbook, par. 174).
  bank_alias: Bank A
  country_alias: Country A
  # Session plan: default number and length of the real sessions. Inputs of the design team.
  sessions:
    value: 3
    unit: sessions
    source: ASSUMPTION
  session_hours:
    value: 3
    unit: hours per session
    source: ASSUMPTION
  # Short economic background for the dossier, as it stands before the exercise starts.
  # One per scenario; `default` is used for any other. Placeholders: {bank_name}, {country}.
  background:
    default: >-
      The economy of {country} is growing slowly and its banking system is profitable and
      well capitalised on average. Funding markets work normally. {bank_name} is one of
      several banks of its kind in {country}.
    fast_run: >-
      The economy of {country} is growing slowly and its banking system is profitable on
      average. Most customers of {bank_name} bank online and can move money within minutes.
      Rumours about individual banks have circulated on social media in recent months.
    slow_burn: >-
      Growth in {country} has slowed and analysts have questioned the business model of
      some banks for several quarters. {bank_name} has had a run of weak results and its
      share price has underperformed its peers.
    cyber_outage: >-
      The economy of {country} is stable. Banks have invested heavily in digital channels,
      and supervisors have asked them to test their resilience to technology failures.
      {bank_name} depends on a small number of technology providers for its payments.
    geopolitical: >-
      {country} is an open economy with close trade and financial links abroad. Tensions in
      a neighbouring region have risen in recent weeks and markets are nervous. {bank_name}
      relies in part on market funding and has some exposure to the region.
    loss_revealed: >-
      After several years of fast credit growth in {country}, loan quality has started to
      weaken in some sectors. {bank_name} grew faster than its peers, and its auditors are
      reviewing part of its loan book.
  # SimEx Charter. Elements and descriptions quote Annex 1 of the Handbook. `draft` is this
  # project's pre-filled proposal for the third column, "Concrete elements"; empty = left
  # blank for the design team. Placeholders: {bank_name}, {taxonomy}, {mode}, {decisions},
  # {challenges}.
  charter:
    - element: Project Manager
      description: Person responsible for the execution of the project
    - element: Sponsor(s)
      description: Person(s) responsible for approving the simulation
    - element: Main Goal
      description: As stated in the original enunciation
      draft: >-
        Exercise the coordination between the competent authority, the resolution authority,
        the central bank and the deposit guarantee scheme in the failure of {bank_name}, in
        a crisis of this type: {taxonomy}.
    - element: Tentative Deadline
      description: When the simulation is scheduled to be carried out
    - element: Expected Key Outcome(s)
      description: Identified outcomes expected from the simulation
      draft: >-
        A decision by the players, taken in time and with the consultations expected, on
        each of: {decisions}. A record of who knew what, and when.
    - element: Elements in Scope (Must-Have)
      description: Identification of elements in scope that are a must-have
      draft: >-
        The stages from the first recovery indicator to the application of a resolution
        tool or the wind-up of {bank_name}. Exchange of information between the four
        authorities. The decisions listed above.
    - element: Elements in Scope (Nice to Have)
      description: Elements in scope but only nice to have
      draft: >-
        Communication with the media and the finance ministry. Challenge injects:
        {challenges}.
    - element: Elements Not in Scope (Constraints)
      description: Identification of elements not in scope
      draft: >-
        Legal loss-absorption thresholds. The execution of the tool and the period after the
        bank reopens. Other banks and contagion. Cross-border coordination. The drafting of
        legal acts.
    - element: Type of SimEx that best fits the goals
      description: ""
      draft: >-
        To be chosen by the design team. As generated, the exercise is {mode}.
    - element: References
      description: References to any existing materials or tools (e.g. the procedure that should be tested)
      draft: >-
        EBA Handbook on simulation exercises for resolution authorities. The procedures to
        be tested are to be added by the design team.
  # Rules of play, by the three categories of the Handbook (par. 155). Draft rules of this
  # project; the engine adds the rules that depend on the pack (calendar, type of exercise,
  # stakeholders played by the control team).
  rules:
    scenario:
      - "{bank_name} and {country} are fictitious. Do not look for a real institution behind them."
      - "You know only what is in the dossier and on the sheets you are handed. Other players may hold more recent figures than you: ask them."
      - "Simulated time runs faster than real time. The control team announces each new simulated day and each new phase."
      - "The legal framework is the one you would apply in a real case. Where the exercise simplifies it, the control team says so."
    play:
      - "Decisions are given to the control team in writing, with the time and the names of those who were consulted."
      - "A decision takes effect on the simulated day after it is taken."
      - "Use the agreed channel for every exchange with other players. Mark every message and document \"SIMULATION\"."
      - "To contact a stakeholder who is not a player, ask the control team. It plays that stakeholder or tells you that it is out of scope."
      - "Do not contact anyone outside the exercise in the name of the exercise."
    behaviour:
      - "Act in your real role and follow your real procedures as far as the exercise allows."
      - "Your actions and omissions in the exercise are not used for any kind of professional evaluation."
      - "The rules do not change once the exercise has started. The control team steps in if a rule is broken."
      - "Observers watch and take notes. They do not answer questions and do not take part."
      - "What you learn in the exercise about other authorities' procedures stays among those who took part."
  # What an observer is asked to track for the team it follows (par. 101), besides the
  # decisions and notifications of that team, which the engine lists.
  observer_tracks:
    - "The time the team needs from receiving an inject to acting on it."
    - "The number of exchanges with each other team, and who started them."
    - "Whether the team asks for information it lacks, and whom it asks."
    - "Whether the team keeps a record of its decisions and of the figures behind them."
    - "Moments where the team is stuck, and what gets it moving again."
  # Feedback questionnaire: quoted from Annex 7 of the Handbook, in its order.
  questionnaire_intro: >-
    Suggestions for feedback questions. Some of the questions employ a 1–5 scale where 1 =
    poor and 5 = excellent
  questionnaire:
    - "Did the SimEx meet its aims and objectives? [1–5]"
    - "Did the SimEx design encourage useful discussions and learnings? [1–5]"
    - "What are the most important lessons you learned from these exercises?"
    - "Was the SimEx well facilitated? [1–5]"
    - "Do you have any suggestions for running SimEx more smoothly and efficiently next time?"
    - "Did the pre-briefing materials provide sufficient information for participation in the SimEx? [1–5]"
    - "What additional materials did you have to obtain to progress in the SimEx?"
    - "Do you think the simulation was well organised and managed? [1–5]"
    - "Please give an example of one element you would change to improve the management of the SimEx."
    - "Were there any assets (resolution plan, bail-in playbook, etc.) that were particularly useful in the simulation? Were there any resources that were not used at all in the simulation? Which one(s)?"
    - "How clear was your role and what was expected of you? [1–5]"
    - "Did you find you had tasks to complete that you didn’t anticipate?"
    - "Were the time limits set realistic to implement? [1–5]"
    - "Which tasks or actions should have had a longer timeframe to complete?"
    - "Were you at all times aware of the overall progress of the simulation? [1–5]"
    - "Were there some elements or processes in the simulation that worked particularly well? Which ones were they?"
    - "Were there any elements or processes in the simulation that worked poorly, felt unnecessary or were difficult to apply? Which ones were they?"
    - "What are the three key learnings from SimEx, in your view?"
    - "If you could change three things for the next simulation, which would these be?"

# One question per decision, put to the actor that decides.
questions:
  public_statement: What would you say in public, and what would you leave out? Who needs to see the statement before it goes out?
  recovery_options: Which recovery options can still be carried out in the time you have? What would a sale cost, and how soon would the cash arrive?
  early_intervention_measures: Is the bank's own response adequate? Which measure would change the situation in the time available?
  declare_foltf: Is the bank failing or likely to fail on what you know now? What would you still need to know, and what does waiting cost?
  ela: Is the bank solvent on what you know? Against which collateral would you lend, how much, and for how long?
  moratorium: Would suspending payments protect value or deepen the loss of confidence? What must be ready before the suspension ends?
  resolution_tool: Is resolution in the public interest? Which tool fits this bank, and what does each need to be in place?
  prepare_payout: What must be ready to pay covered depositors quickly? Which data do you need from the bank, and from whom do you get them?
  dgs_payout: Are you ready to pay? How will depositors be told, and how is the payout funded?

# Coordination steps for each decision: who the deciding actor should consult before, and
# inform after. A draft for discussion in the exercise, not a statement of legal duties.
coordination:
  public_statement:
    consult: [competent_authority]
    inform: [competent_authority, central_bank]
  recovery_options:
    consult: []
    inform: [competent_authority]
  early_intervention_measures:
    consult: [resolution_authority]
    inform: [bank_management, resolution_authority, central_bank]
  declare_foltf:
    consult: [resolution_authority, central_bank]
    inform: [bank_management, resolution_authority, central_bank, deposit_guarantee_scheme]
  ela:
    consult: [competent_authority]
    inform: [bank_management, competent_authority, resolution_authority]
  moratorium:
    consult: [competent_authority, central_bank]
    inform: [bank_management, competent_authority, central_bank, deposit_guarantee_scheme]
  resolution_tool:
