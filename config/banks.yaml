# Bank archetypes. All banks are fictitious. Proportions of the universal and retail archetypes
# are calibrated on EBA data where available (docs/CALIBRATION.md); the rest is ASSUMPTION.
# Equity is represented by CET1: assets = liabilities + cet1.
# wholesale_funding.maturing: amount falling due on each simulated day (key = day).

universal:
  name: Large universal bank
  description: Diversified group with retail, corporate and market activities and sizeable wholesale funding.
  unit: EUR bn
  # Lines without an entry in `sources` (HQLA, collateral, capital requirement) and the size.
  source: ASSUMPTION
  sources:
    cash_reserves: "EBA 2025 EU-wide Transparency Exercise, tr_oth.csv, June 2025, peer median of item 2521001 / 2521010; docs/CALIBRATION.md"
    illiquid_assets: "Remainder of total assets; depends on the HQLA and collateral lines, which are ASSUMPTION"
    insured_retail: "Retail total: EBA 2025 EU-wide Transparency Exercise, tr_oth.csv, June 2025, peer median of household deposits; insured share is ASSUMPTION"
    uninsured_retail: "Retail total: EBA 2025 EU-wide Transparency Exercise, tr_oth.csv, June 2025, peer median of household deposits; insured share is ASSUMPTION"
    corporate: "EBA 2025 EU-wide Transparency Exercise, tr_oth.csv, June 2025, peer median of deposits from non-financial corporations and general governments; docs/CALIBRATION.md"
    financial: "EBA 2025 EU-wide Transparency Exercise, tr_oth.csv, June 2025, peer median of deposits from other financial corporations and credit institutions; docs/CALIBRATION.md"
    wholesale_funding: "Total: EBA 2025 EU-wide Transparency Exercise, tr_oth.csv, June 2025, peer median of debt securities issued; maturity ladder is ASSUMPTION"
    other_liabilities: "Remainder of total assets after deposits, wholesale funding and CET1; docs/CALIBRATION.md"
    cet1: "EBA 2025 EU-wide Transparency Exercise, tr_oth.csv, June 2025, peer median of item 2520102 / 2521010; docs/CALIBRATION.md"
    rwa: "EBA 2025 EU-wide Transparency Exercise, tr_oth.csv, June 2025, peer median of item 2520138 / 2521010; docs/CALIBRATION.md"
  assets:
    cash_reserves: 99.4
    hqla_level1: 120.0
    hqla_level2: 30.0
    other_eligible_collateral: 120.0
    illiquid_assets: 630.6
  liabilities:
    deposits:
      insured_retail: 219.8
      uninsured_retail: 75.8
      corporate: 195.3
      financial: 129.7
    wholesale_funding:
      maturing:
        2: 3.6
        5: 3.6
        9: 5.8
        14: 5.1
        21: 7.3
        27: 7.3
      beyond_horizon: 148.6
    other_liabilities: 150.5
  capital:
    cet1: 47.6
    rwa: 303.3
    capital_requirement_ratio: 0.11

