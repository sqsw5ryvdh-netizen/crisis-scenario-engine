# Bank archetypes. All amounts are fictitious, with realistic proportions.
# Equity is represented by CET1: assets = liabilities + cet1.
# wholesale_funding.maturing: amount falling due on each simulated day (key = day).

universal:
  name: Large universal bank
  description: Diversified group with retail, corporate and market activities and sizeable wholesale funding.
  unit: EUR bn
  source: ASSUMPTION
  assets:
    cash_reserves: 110.0
    hqla_level1: 120.0
    hqla_level2: 30.0
    other_eligible_collateral: 120.0
    illiquid_assets: 620.0
  liabilities:
    deposits:
      insured_retail: 290.0
      uninsured_retail: 100.0
      corporate: 170.0
      financial: 40.0
    wholesale_funding:
      maturing:
        2: 5.0
        5: 5.0
        9: 8.0
        14: 7.0
        21: 10.0
        27: 10.0
      beyond_horizon: 205.0
    other_liabilities: 95.0
  capital:
    cet1: 55.0
    rwa: 380.0
    capital_requirement_ratio: 0.11

