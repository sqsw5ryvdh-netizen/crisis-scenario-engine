# Templates for the exercise script ("injects"), spec section 4.3.
# For each key event: a situation line for the facilitator and, per actor, what the actor
# sees and which decision is due. Placeholders in {braces} are filled with simulated numbers;
# the allowed names are listed in engine/schema.py (INJECT_FIELDS).
# DRAFT WORDING: written for the prototype, with no legal references. To be reviewed by the
# project team before any use in a real exercise.

actors:
  competent_authority: Competent authority
  resolution_authority: Resolution authority
  central_bank: Central bank
  deposit_guarantee_scheme: Deposit guarantee scheme
  bank_management: Bank management

summary:
  failure: >-
    In this run, {bank_name} goes through the "{scenario_name}" scenario and can no
    longer pay its obligations in full on day {failure_day} (payments default). By then it has lost {deposit_loss_pct} of
    its deposits. The estimated funding need in resolution is {funding_need} {unit}, which
    covers {funding_need_days} days of projected outflows after that day.
  no_failure: >-
    In this run, {bank_name} goes through the "{scenario_name}" scenario and keeps paying its
    obligations for the whole {horizon_days} days. It loses {deposit_loss_pct} of its deposits and ends the
    period with a liquidity buffer of {liquidity_buffer} {unit} and a CET1 ratio of
    {cet1_ratio_pct}.

  resolved: >-
    In this run, {bank_name} goes through the "{scenario_name}" scenario and is declared
    failing or likely to fail before it defaults on payments. The run ends on day {day}
    with this outcome: {outcome}. By then the bank has lost {deposit_loss_pct} of its
    deposits.

disclaimer: >-
  The bank in this script is fictitious. All figures are produced by a simplified simulation
  model whose parameters are assumptions, not calibrated estimates. The script is a training
  aid for crisis simulation exercises and does not describe any real institution.

glossary:
  - term: Liquidity buffer
    definition: Cash and central bank reserves, plus liquid securities valued after a haircut, plus central bank funding capacity that is already usable.
  - term: HQLA
    definition: High-quality liquid assets. Securities the bank can sell quickly to raise cash.
  - term: LCR proxy
    definition: A simplified liquidity coverage ratio. Cash and liquid securities divided by the outflows expected over 30 days of stress. Below 100% the bank holds less than it may need.
  - term: Survival horizon
    definition: The number of days the liquidity buffer would last if outflows continued at today's speed.
  - term: CET1 ratio
    definition: The bank's highest-quality capital divided by its risk-weighted assets. It must stay above the capital requirement.
  - term: Fire sale
    definition: Selling loans or other illiquid assets in a hurry, at a discount. The loss reduces the bank's capital.
  - term: Queued withdrawals
    definition: Withdrawals customers have requested during a payment outage that the bank has not yet been able to execute.
  - term: Recovery, early intervention, likely to fail, payments default
    definition: The four escalation stages used in this script. Recovery is led by the bank and early intervention by the competent authority. Likely to fail is a forward-looking warning raised by the model when liquidity or capital is about to run out. Payments default is the first day the bank cannot pay its obligations in full.
  - term: Funding need in resolution
    definition: The liquidity required to cover projected outflows in the days after the payments default.

events:
  opening:
    title: Opening briefing
    situation: >-
      {bank_name} starts the exercise in normal conditions. Deposits are {deposits_total}
      {unit}, the liquidity buffer is {liquidity_buffer} {unit}, the LCR proxy is {lcr_pct}
      and the CET1 ratio is {cet1_ratio_pct} against a requirement of {cet1_requirement_pct}.
    injects:
      competent_authority:
        sees: Regular supervisory reporting shows no breach. LCR proxy {lcr_pct}, CET1 ratio {cet1_ratio_pct}.
        decision: No decision is due. Confirm contact points and reporting lines for the exercise.
      resolution_authority:
        sees: The bank is in business as usual. No notification has been received.
        decision: No decision is due. Confirm that the resolution plan and contact list for the bank are at hand.
      central_bank:
        sees: The bank holds {unencumbered_collateral} {unit} of unencumbered liquid assets and eligible collateral and has no central bank funding outstanding.
        decision: No decision is due.
      deposit_guarantee_scheme:
        sees: Covered deposits at the bank are about {insured_deposits} {unit}.
        decision: No decision is due.
      bank_management:
        sees: Funding is stable. The liquidity buffer of {liquidity_buffer} {unit} would cover {survival_days} days at the current pace of outflows.
        decision: No decision is due. Confirm who would lead the liquidity contingency plan.

  outage_start:
    title: Payment outage begins
    situation: >-
      Customers cannot access their accounts or make payments. Withdrawal requests cannot be
      executed and start to queue; {queued_withdrawals} {unit} is waiting at the end of the day.
    injects:
      bank_management:
        sees: Payment channels are down. Customers have asked to withdraw {queued_withdrawals} {unit} that cannot be executed.
        decision: Decide what to tell customers and the authorities, and how to prepare for the release of queued withdrawals when service returns.
      competent_authority:
        sees: The bank reports a major operational incident. No money has left yet, but {queued_withdrawals} {unit} of withdrawals are queued.
        decision: Decide what information to request from the bank and how often, and which other authorities to inform.
      central_bank:
        sees: The bank is not sending or receiving payments. Its liquidity buffer is unchanged at {liquidity_buffer} {unit}.
        decision: Decide whether to check the bank's collateral now, so that funding could be provided quickly when payments resume.

  outage_end:
    title: Service returns and queued withdrawals are released
    situation: >-
      Payment services are restored. Queued withdrawals are executed together with today's
      requests, for a total outflow of {outflow_today} {unit} in one day. The liquidity
      buffer falls to {liquidity_buffer} {unit}.
    injects:
      bank_management:
        sees: Outflows of {outflow_today} {unit} today. The remaining buffer covers {survival_days} days at this pace.
        decision: Decide which funding sources to use next and whether to ask the central bank for funding.
      competent_authority:
        sees: Deposits are down {deposit_loss_pct} since the start. LCR proxy {lcr_pct}.
        decision: Decide whether the bank's liquidity position calls for supervisory measures.
      central_bank:
        sees: A large one-day outflow of {outflow_today} {unit}. The bank has {unencumbered_collateral} {unit} of unencumbered liquid assets and eligible collateral left.
        decision: Decide whether funding can be provided against the remaining collateral, and on what terms.

  news:
    title: News event
    situation: >-
      News on day {day}: {headline} Today's outflow is {outflow_today} {unit}; deposits are
      down {deposit_loss_pct} since the start.
    injects:
      bank_management:
        sees: "The news of the day: {headline} Outflows today are {outflow_today} {unit}."
        decision: Decide on a public statement and on whether to step up liquidity monitoring.
      competent_authority:
        sees: Media coverage of the bank, and its latest figures. Liquidity buffer {liquidity_buffer} {unit}, LCR proxy {lcr_pct}.
        decision: Decide whether to ask the bank for daily liquidity reporting and whether to brief the other authorities.

  first_hqla_sale:
    title: The bank starts selling liquid securities
    situation: >-
      Cash and reserves are no longer enough to meet outflows. The bank sells liquid
      securities to raise {hqla_sold_today} {unit} today.
    injects:
      bank_management:
        sees: Cash is used up. Securities sales raised {hqla_sold_today} {unit} today, at a loss of {loss_today} {unit}.
        decision: Decide how fast to sell the remaining securities and whether to prepare collateral for central bank funding.
      competent_authority:
        sees: The bank is selling its liquid securities. LCR proxy {lcr_pct}; survival horizon {survival_days} days.
        decision: Decide whether to request the bank's funding plan for the coming days.

  first_central_bank:
    title: First use of central bank funding
    situation: >-
      Liquid securities are exhausted. The bank draws {central_bank_drawn_today} {unit} from
      the central bank against collateral.
    injects:
      central_bank:
        sees: The bank draws {central_bank_drawn_today} {unit}. Total central bank funding is {central_bank_funding} {unit}; {unencumbered_collateral} {unit} of collateral remains unencumbered.
        decision: Decide whether to continue lending against the remaining collateral and whether to change the terms.
      bank_management:
        sees: The bank now depends on central bank funding. The remaining buffer covers {survival_days} days at today's pace.
        decision: Decide which further measures to take before the collateral runs out.
      competent_authority:
        sees: The bank has started to rely on central bank funding. Deposits are down {deposit_loss_pct}.
        decision: Decide whether the situation should be discussed with the resolution authority.

  first_fire_sale:
    title: The bank starts selling loans at a discount
    situation: >-
      Central bank funding capacity is used up. The bank sells illiquid assets at a discount
      to raise {fire_sale_today} {unit} today. The losses reduce its capital; the CET1 ratio
      is {cet1_ratio_pct} against a requirement of {cet1_requirement_pct}.
    injects:
      bank_management:
        sees: Asset sales raised {fire_sale_today} {unit} today. Losses on sales today are {loss_today} {unit}.
        decision: Decide whether to continue selling assets at a loss or to tell the authorities that the bank cannot meet its obligations much longer.
      competent_authority:
        sees: The liquidity problem is becoming a capital problem. CET1 ratio {cet1_ratio_pct}, requirement {cet1_requirement_pct}.
        decision: Decide whether the bank can still be expected to recover on its own.
      resolution_authority:
        sees: The bank is selling assets at a discount. Each day of sales reduces the value that would be available in resolution.
        decision: Decide whether the asset sales change the preferred resolution strategy and how advanced the preparation needs to be.

  recovery:
    title: Recovery indicator breached
    situation: >-
      A recovery indicator is breached: {trigger_reason}. The bank starts mobilising
      collateral for central bank funding.
    injects:
      bank_management:
        sees: "A recovery indicator is breached: {trigger_reason}."
        decision: Decide whether to activate the recovery plan, which recovery options to use, and when to notify the supervisor.
      competent_authority:
        sees: "The bank notifies a breach of a recovery indicator: {trigger_reason}. Liquidity buffer {liquidity_buffer} {unit}."
        decision: Decide whether the bank's response is adequate, whether to intensify monitoring, and whether to alert the resolution authority and the central bank.
      central_bank:
        sees: The bank begins to prepare collateral. It holds {unencumbered_collateral} {unit} of unencumbered liquid assets and eligible collateral.
        decision: Decide whether to start assessing the collateral so that funding can be made available without delay.
      resolution_authority:
        sees: The competent authority reports that the bank has breached a recovery indicator. Deposits are down {deposit_loss_pct}.
        decision: Decide whether to start contingency preparation, such as checking that up-to-date data on the bank can be obtained quickly.

  early_intervention:
    title: Early intervention conditions met
    situation: >-
      The conditions for early intervention are met: {trigger_reason}. The liquidity buffer
      is {liquidity_buffer} {unit} and would last {survival_days} days at today's pace.
    injects:
      competent_authority:
        sees: "The bank's position has deteriorated further: {trigger_reason}."
        decision: Decide whether to use early intervention measures, and which ones.
      resolution_authority:
        sees: The competent authority reports that early intervention conditions are met. Survival horizon {survival_days} days.
        decision: Decide whether to step up resolution preparation, including requesting detailed data from the bank and preparing a valuation.
      central_bank:
        sees: The bank's liquid resources are shrinking. {unencumbered_collateral} {unit} of liquid assets and eligible collateral remains unencumbered.
        decision: Decide how much funding could be provided against the remaining collateral and how quickly.
      deposit_guarantee_scheme:
        sees: The authorities report a serious deterioration at the bank. Covered deposits are about {insured_deposits} {unit}.
        decision: Decide whether to check that depositor data and funding would be ready if the scheme were called upon.
      bank_management:
        sees: Deposits are down {deposit_loss_pct} since the start. The buffer covers {survival_days} days at today's pace.
        decision: Decide which remaining recovery options can still be carried out in time.

  likely_to_fail:
    title: The bank is likely to fail
    situation: >-
      On current trends the bank will not be able to continue on its own: {trigger_reason}.
      It is still paying its obligations today. The liquidity buffer is {liquidity_buffer}
      {unit} and the CET1 ratio is {cet1_ratio_pct} against a requirement of
      {cet1_requirement_pct}.
    injects:
      competent_authority:
        sees: "Forward-looking assessment: {trigger_reason}. The bank is still meeting its payments."
        decision: Decide whether to determine that the bank is failing or likely to fail, or to wait, and on what grounds.
      resolution_authority:
        sees: The competent authority reports that the bank is likely to fail. Survival horizon {survival_days} days; deposits down {deposit_loss_pct} since the start.
        decision: Decide whether resolution preparation is complete enough to act at short notice, and what is still missing.
      central_bank:
        sees: The bank's usable liquidity is close to exhaustion. {unencumbered_collateral} {unit} of liquid assets and eligible collateral remains unencumbered.
        decision: Decide whether further liquidity could be provided, against which collateral, and under what conditions.
      deposit_guarantee_scheme:
        sees: The authorities report that the bank is likely to fail. Covered deposits are about {insured_deposits} {unit}.
        decision: Decide whether to start preparing for a possible payout.
      bank_management:
        sees: The buffer covers {survival_days} days at today's pace. CET1 ratio {cet1_ratio_pct}.
        decision: Decide what to tell the authorities about the bank's ability to continue, and which measures are still possible.

  failure:
    title: Payments default
    situation: >-
      The bank cannot pay its obligations in full: {trigger_reason}. The estimated funding
      need in resolution is {funding_need} {unit}, covering {funding_need_days} days of
      projected outflows.
    injects:
      competent_authority:
        sees: "The bank has defaulted on payments: {trigger_reason}. CET1 ratio {cet1_ratio_pct}; deposits down {deposit_loss_pct} since the start."
        decision: Decide on the determination that the bank is failing or likely to fail, if it has not been made yet.
      resolution_authority:
        sees: The bank has defaulted on payments. Estimated funding need in resolution is {funding_need} {unit} over {funding_need_days} days.
        decision: Decide whether resolution is in the public interest, which resolution approach to use, and how the funding need will be covered.
      central_bank:
        sees: The bank has no usable collateral left for ordinary funding and {central_bank_funding} {unit} of central bank funding is outstanding.
        decision: Decide whether, and under what conditions, liquidity could be provided to the bank in resolution.
      deposit_guarantee_scheme:
        sees: The bank is failing. Covered deposits still at the bank are about {insured_deposits} {unit}.
        decision: Decide how to prepare for the outcome chosen by the resolution authority, either a payout to depositors or a contribution to resolution.
      bank_management:
        sees: The bank cannot meet today's outflows in full. Unpaid outflows today are {unmet_outflow} {unit}.
        decision: Decide what to communicate to customers and staff, in coordination with the authorities, and provide the data the authorities request.

  end_no_failure:
    title: End of the exercise period without failure
    situation: >-
      Day {day} is the last day of the period and the bank is still operating. It has lost
      {deposit_loss_pct} of its deposits; the liquidity buffer is {liquidity_buffer} {unit}
      and the CET1 ratio is {cet1_ratio_pct}.
    injects:
      competent_authority:
        sees: The bank has survived the period. Liquidity buffer {liquidity_buffer} {unit}, LCR proxy {lcr_pct}, CET1 ratio {cet1_ratio_pct}.
        decision: Decide which supervisory follow-up is needed to restore the bank's liquidity position.
      bank_management:
        sees: Outflows have slowed to {outflow_today} {unit} a day. Deposits are down {deposit_loss_pct} since the start.
        decision: Decide on the plan to rebuild the liquidity buffer and regain depositors' confidence.
